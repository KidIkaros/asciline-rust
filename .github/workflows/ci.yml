name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  check:
    name: Check (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (all targets, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace

  test:
    name: Test + differentials + e2e + quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg (decode, audio, e2e)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test

      - name: Bit-exact differential harnesses (Python codec.py + shipped codec.js)
        # The input vectors (vectors_profile_py.bin / vectors_python.bin) are
        # committed and drift-checked by the `vectors-check` job, so this needs
        # no numpy or the original ASCILINE repo. roundtrip_profile /
        # decode_python_vectors emit the Rust-side bins the node scripts then
        # verify against the unchanged browser decoder.
        run: |
          cargo test --test decode_profile_vectors -- --ignored
          cargo test --test roundtrip_profile -- --ignored
          node experiments/check_profile_vectors.js
          node experiments/check_profile_aq_vectors.js
          node experiments/check_profile_hpel_vectors.js
          cargo test --test decode_python_vectors -- --ignored
          node experiments/check_rust_vectors.js

      - name: Browser-decoder playback of committed .ascf samples (codec.js end-to-end)
        # The exact .ascf bytes shipped in samples/ must decode cleanly in the
        # browser decoder (tag dispatch, keyframe resync, frame sizes, index
        # monotonicity) — this is the playback path web/app.js actually uses.
        run: |
          node experiments/play_ascf.js \
            samples/big_buck_bunny_profile.ascf \
            samples/big_buck_bunny_pixel.ascf \
            samples/big_buck_bunny_ascii.ascf \
            samples/drone_profile.ascf

      - name: e2e server test (real binary over WebSocket)
        run: cargo test --test e2e_server

      - name: Quality gate smoke test (--profile --quality-threshold)
        run: |
          ffmpeg -y -v error -f lavfi -i testsrc2=size=640x360:rate=30:duration=2 \
            -pix_fmt yuv420p /tmp/ci_clip.mp4
          cargo build
          # mean PSNR-Y at QF=70 is ~39 dB: the gate must PASS at 30 ...
          ./target/debug/asciline-compile /tmp/ci_clip.mp4 --cols 240 --profile \
            --qf 70 --quality-threshold 30 --out /tmp/ci_pass
          # ... and FAIL at 50 (exit non-zero).
          if ./target/debug/asciline-compile /tmp/ci_clip.mp4 --cols 240 --profile \
              --qf 70 --quality-threshold 50 --out /tmp/ci_fail > /dev/null 2>&1; then
            echo "quality gate should have failed at threshold 50" >&2
            exit 1
          fi
          rm -f /tmp/ci_clip.mp4 /tmp/ci_pass.ascf /tmp/ci_pass.mp3 \
                /tmp/ci_fail.ascf /tmp/ci_fail.mp3

      - name: Release build
        run: cargo build --release

  fuzz:
    name: Fuzz smoke (nightly, cargo-fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          cargo install cargo-fuzz --locked || cargo install cargo-fuzz

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build all fuzz targets
        run: cargo +nightly fuzz build

      - name: Smoke-fuzz each target (45 s each)
        # The committed corpus (fuzz/corpus) carries real tag-4 / adaptive
        # wire records; libFuzzer perturbs them into the deep decoder paths.
        # A crash here fails the build — same guarantee as the proptest
        # harness, but with libFuzzer's mutation engine.
        run: |
          for t in fuzz_parse_ascf fuzz_adaptive_decode fuzz_profile_decode fuzz_ascf_stream; do
            echo "=== $t ==="
            timeout 75 cargo +nightly fuzz run "$t" -- -max_total_time=45 2>&1 \
              | grep -E 'Done|NEW|crash|ERROR|SUMMARY|Test unit written' | tail -3
          done

      - name: Fail if any crash was found
        # cargo-fuzz creates per-target artifact *directories* after every run,
        # so match regular files only (a real crash is a file, e.g.
        # fuzz/artifacts/<target>/crash-<hash>).
        run: |
          if find fuzz/artifacts -type f ! -name 'README*' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::libFuzzer found crashes in fuzz/artifacts/"
            find fuzz/artifacts -type f ! -name 'README*'
            exit 1
          fi
          echo "no crashes"

  corpus-check:
    name: Fuzz corpus reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg (deterministic source generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Regenerate the corpus and fail on drift
        # The committed fuzz/corpus is generated deterministically
        # (lossless FFV1 source -> thread-count-independent compiler); this
        # job regenerates it and fails if the working tree differs, keeping
        # CI fuzzing on the exact committed seeds.
        run: |
          experiments/make_fuzz_corpus.sh
          if [ -n "$(git status --porcelain fuzz/corpus)" ]; then
            echo "::error::fuzz/corpus drifted from the committed seeds — run experiments/make_fuzz_corpus.sh and commit the result"
            git status --porcelain fuzz/corpus | head -10
            exit 1
          fi
          echo "corpus is byte-reproducible"

  vectors-check:
    name: Differential vectors reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python + numpy
        run: |
          python3 -m pip install --quiet numpy || { sudo apt-get update && sudo apt-get install -y python3-numpy; }

      - name: Regenerate and compare the committed vectors
        # vectors_python.bin / vectors_profile_py.bin are produced by the
        # vendored original codec.py (experiments/vendor/) + numpy. Regenerate
        # and fail on any byte drift, so the bit-exact differential harnesses
        # always run against the exact committed inputs.
        run: |
          python3 experiments/gen_python_vectors.py > /tmp/vectors_python.bin
          python3 experiments/gen_profile_vectors.py > /tmp/vectors_profile_py.bin
          if ! cmp /tmp/vectors_python.bin experiments/vectors_python.bin; then
            echo "::error::experiments/vectors_python.bin drifted — regenerate it (python3 experiments/gen_python_vectors.py > experiments/vectors_python.bin) and commit"
            exit 1
          fi
          if ! cmp /tmp/vectors_profile_py.bin experiments/vectors_profile_py.bin; then
            echo "::error::experiments/vectors_profile_py.bin drifted — regenerate it (python3 experiments/gen_profile_vectors.py > experiments/vectors_profile_py.bin) and commit"
            exit 1
          fi
          echo "differential vectors are byte-reproducible"

  samples-check:
    name: Sample evidence artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg (artifact metadata checks)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate pinned sources and published evidence
        run: |
          set -euo pipefail
          sha256sum -c <(printf '%s  %s\n' \
            '8f113ef593688f47ec8d8b0d093fb955cb04bc350826c775d2e9ca451870856e' \
            samples/source/big_buck_bunny_excerpt_30fps.mp4; \
            printf '%s  %s\n' \
            '1cf8e47cdef1c3acb4cab994a463a0ca6dabe1532bc89f09f90873dae45e98e8' \
            samples/source/big_buck_bunny_excerpt_60fps.mp4; \
            printf '%s  %s\n' \
            '0799500294387e7c60f9fe611cdddc611c6c30d9171d63c9d3f399385781d208' \
            samples/source/drone_excerpt_720p60.mp4)
          test ! -e samples/mandelbrot_profile.ascf
          test ! -e samples/evidence/stream_120fps.mp4
          for f in \
            samples/evidence/cartoon_compare.gif \
            samples/evidence/cartoon_profile.gif \
            samples/evidence/cartoon_difference.gif \
            samples/evidence/cartoon_source_profile_large.gif \
            samples/evidence/cartoon_detail_compare.gif \
            samples/evidence/throughput_120fps.gif \
            samples/evidence/drone_compare.gif \
            samples/evidence/drone_profile.gif; do
            test -f "$f"
            test "$(stat -c %s "$f")" -lt 10000000
          done
          for f in samples/evidence/*.mp4; do
            test -n "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f")"
          done
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 samples/evidence/cartoon_compare.mp4)" = '30/1'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 samples/evidence/cartoon_wire_120fps.mp4)" = '120/1'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 samples/evidence/throughput_120fps.mp4)" = '120/1'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 samples/evidence/drone_compare.mp4)" = '60/1'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 samples/evidence/drone_profile.mp4)" = '60/1'
          test -f samples/drone_profile_quality.txt
          grep -q 'PSNR-Y' samples/drone_profile_quality.txt
          test -f samples/drone_pixel.ascf
          test -f samples/drone_profile.ascf
          test -f samples/big_buck_bunny_speed_analysis.md
          grep -q 'Compile FPS' samples/big_buck_bunny_speed_analysis.md
          test -f samples/evidence/player_display_benchmark.md
          grep -q '| 120 fps | 480 | 4 s |' samples/evidence/player_display_benchmark.md
          grep -q '| 120 | 480 | 480 |' samples/evidence/throughput_matrix.md
          grep -q 'unique source hashes: 480' samples/evidence/throughput_benchmark.log
          if grep -RInE 'mandelbrot_|stream_120fps|quality_compare|pixel\.gif' README.md samples CHANGELOG.md; then
            echo 'stale synthetic evidence reference found' >&2
            exit 1
          fi
          echo 'sample evidence artifacts are present, licensed, and valid'

  security-audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit || true

      - name: Run cargo audit
        run: cargo audit
