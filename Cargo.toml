[package]
name = "asciline"
version = "0.1.0"
edition = "2021"
description = "Rust port of ASCILINE: real-time ASCII video rendering engine (decode -> ASCII map -> adaptive codec -> stream)"
license = "MIT"
readme = "README.md"
keywords = ["ascii", "video", "websocket", "terminal", "codec"]
categories = ["multimedia", "command-line-utilities"]

[lib]
name = "asciline"
path = "src/lib.rs"

[[bin]]
name = "asciline-server"
path = "src/bin/server.rs"

[[bin]]
name = "asciline-player"
path = "src/bin/player.rs"

[[bin]]
name = "asciline-compile"
path = "src/bin/compile.rs"

[[bin]]
name = "asciline-render"
path = "src/bin/render.rs"

[dependencies]
# Async runtime + web server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "tokio"] }
futures-util = "0.3"

# Compression (zlib) — flate2's default pure-Rust miniz_oxide backend.
# Measured on real clips (experiments/compare_zlib_backends.sh): miniz_oxide
# produces ~23% smaller .ascf files than zlib-rs on the adaptive pixel path at
# the same compression level (the profile path is a wash), while zlib-rs's
# speed edge was marginal and reversed on the profile path. Size wins for a
# codec container. Both backends are pure Rust; swap via that script.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Parallelism for the frame mapper
rayon = "1"

# CLI + serialization
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
anyhow = "1"

# Observability: RUST_LOG-controlled server logging
# (basic console output stays on stdout; tracing carries lifecycle/errors)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Terminal size probing
crossterm = "0.28"

# 8×8 bitmap glyphs for asciline-render's ASCII rasterization (public domain)
font8x8 = "0.2"

# Graceful Ctrl+C for the terminal player
ctrlc = "3"

[dev-dependencies]
tokio-tungstenite = "0.26"
# Property-based malformed-input harnesses for the decoders (stable, no fuzz crate)
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
