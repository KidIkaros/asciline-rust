[package]
name = "asciline-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
asciline = { path = ".." }

# Keep the fuzz binaries debuggable (cargo-fuzz requirement).
[profile.release]
debug = 1

[[bin]]
name = "fuzz_parse_ascf"
path = "fuzz_targets/fuzz_parse_ascf.rs"
test = false
doc = false

[[bin]]
name = "fuzz_adaptive_decode"
path = "fuzz_targets/fuzz_adaptive_decode.rs"
test = false
doc = false

[[bin]]
name = "fuzz_profile_decode"
path = "fuzz_targets/fuzz_profile_decode.rs"
test = false
doc = false

[[bin]]
name = "fuzz_ascf_stream"
path = "fuzz_targets/fuzz_ascf_stream.rs"
test = false
doc = false
